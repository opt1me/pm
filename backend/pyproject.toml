[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Project Management MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pytest",
    "httpx",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
